[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "russian-keyboard-trainer"
version = "1.0.0"
description = "Training pipeline for compact Russian Android keyboard context ranker"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.7,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
rsk-train = "rsk_trainer.train:main"
rsk-eval = "rsk_trainer.evaluate:main"
rsk-export = "rsk_trainer.export_onnx:main"
rsk-mine = "rsk_trainer.mine_hard_negatives:main"
rsk-build = "rsk_trainer.build_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
