name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python scripts/make_demo_corpus.py
      - run: rsk-build --clean data/examples/demo_clean.txt --out data/generated --synthetic-groups 120 --keep-groups 100
      - name: Listwise smoke train
        run: |
          python - <<'PY'
          import json
          c=json.load(open('configs/ranker_small.json'))
          c.update({'epochs':1,'batch_size':32,'d_model':64,'nhead':4,'num_layers':1,'dim_feedforward':128,'num_workers':0,'amp':False,'patience':1})
          json.dump(c,open('/tmp/smoke.json','w'))
          PY
          rsk-train --config /tmp/smoke.json --out artifacts/ci-smoke
      - name: Verify calibration artifact
        run: test -s artifacts/ci-smoke/best.pt && test -s artifacts/ci-smoke/calibration.json
