name: Offline Smart Keyboard debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/offline-smart-keyboard-v0.4
    paths:
      - '.github/workflows/offline-smart-keyboard-apk.yml'
      - 'android/offline-smart-keyboard/**'

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Restore full Android project from verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          cd android/offline-smart-keyboard
          cat bundle/v0.4.part0{1..7}.b64 | base64 --decode | tar -xJf -
          test -f app/build.gradle.kts
          test -f app/src/main/java/dev/offline/smartkeyboard/ime/OfflineKeyboardService.kt
          test -f app/src/main/assets/ru_words.txt
          echo "Project restored."

      - name: Commit readable source files to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/offline-smart-keyboard
          if ! git diff --cached --quiet; then
            git commit -m "Unpack complete Kotlin keyboard v0.4 sources"
            git push origin HEAD:feature/offline-smart-keyboard-v0.4
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: android/offline-smart-keyboard
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineSmartKeyboard-v0.4-debug-apk
          path: android/offline-smart-keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
