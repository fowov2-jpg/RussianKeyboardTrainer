name: Offline Smart Keyboard debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/corpus-trained-lexicon-v0.16
    paths:
      - '.github/workflows/offline-smart-keyboard-apk.yml'
      - 'android/offline-smart-keyboard/**'

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # GERA lacks an explicit redistribution license. Fetch ephemerally
      # for aggregate-only validation. The source is excluded from APK/artifacts.
      - name: Download GERA external validation corpus (not packaged)
        working-directory: android/offline-smart-keyboard
        run: |
          mkdir -p data/raw
          curl --fail --location --silent --show-error --retry 2 \
            "https://raw.githubusercontent.com/ReginaNasyrova/GERA/main/GERA.dev.m2" \
            --output data/raw/GERA.dev.m2
          curl --fail --location --silent --show-error --retry 2 \
            "https://raw.githubusercontent.com/ReginaNasyrova/GERA/main/GERA.test.m2" \
            --output data/raw/GERA.test.m2

      - name: Run typo regression tests and build debug APK
        working-directory: android/offline-smart-keyboard
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineSmartKeyboard-v0.16-debug-apk
          path: android/offline-smart-keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
