name: android-emulator
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:
jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install build SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Allow KVM on Linux
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Emulator API 30, 3 GB RAM — instrumentation and IME
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 256M
          emulator-boot-timeout: 600
          script: |
            gradle -p android --no-daemon --max-workers=2 connectedDebugAndroidTest
            mkdir -p reports/emulator
            adb shell ime list -s | tee reports/emulator/registered-ime.txt
            grep -F "dev.russiankeyboard.prototype" reports/emulator/registered-ime.txt
            adb shell am start -n dev.russiankeyboard.prototype/.MainActivity
            adb shell dumpsys meminfo dev.russiankeyboard.prototype > reports/emulator/launcher-meminfo.txt
            adb shell cat /proc/meminfo | head -n 6 > reports/emulator/system-meminfo.txt
      - name: Emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-3gb-emulator-reports
          path: |
            reports/emulator/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 7
      - name: Result summary
        if: success()
        run: |
          echo '### Android emulator (3GB RAM, API 30)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Passed instrumentation and IME registration checks. This does **not** certify real phone RAM, thermals or battery.' >> "$GITHUB_STEP_SUMMARY"
